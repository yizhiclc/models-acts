<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#142e2c" />
    <meta
      name="description"
      content="循水入城，向山而生。以0.2米体素构建的武陵城交互游览。"
    />
    <title>武陵城 · 山水之间，万象新生</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas
        id="world"
        tabindex="0"
        aria-label="武陵城三维场景，拖动旋转，滚轮缩放。点击自由飞行后可用WASD移动。"
      ></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <header class="topbar hud">
        <a class="brand" href="./" aria-label="回到武陵城首页"
          ><svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M3 29 12 11l8 16 8-22 9 24M9 31h25M20 27v9" /></svg
          ><span>山海行记<small>FIELD NOTES / TALOS-II</small></span></a
        >
        <div class="top-controls">
          <span class="live"><i></i>实时漫游</span
          ><button
            id="sound"
            class="icon-button"
            aria-label="开启环境音"
            title="环境音"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M11 5 6 9H3v6h3l5 4ZM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"
              />
            </svg></button
          ><button
            id="info"
            class="icon-button"
            aria-label="作品与参考"
            title="作品与参考"
          >
            i</button
          ><button
            id="help"
            class="icon-button"
            aria-label="操作帮助"
            title="操作帮助"
          >
            ?</button
          ><button
            id="fullscreen"
            class="icon-button"
            aria-label="切换全屏"
            title="全屏"
          >
            <svg viewBox="0 0 24 24">
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5" />
            </svg>
          </button>
        </div>
      </header>
      <section class="title-block hud" aria-label="作品标题">
        <div class="eyebrow">
          <span class="line"></span>塔卫二 · 东方新城
          <span class="issue">VOL. 02</span>
        </div>
        <h1>
          武陵城<span class="seal" aria-hidden="true">山<br />水</span>
        </h1>
        <p class="english">W U L I N G</p>
        <div class="subtitle">山水之间，万象新生。</div>
        <p class="intro">
          循一脉碧水，入千重楼阙。<br />在山与城的交界，发现另一种未来。
        </p>
        <button id="explore" class="primary">入城漫游 <span>↗</span></button>
        <div class="scale">
          <span class="cube">◇</span> 0.2 m / voxel
          <span>·</span> 可交互体素世界
        </div>
      </section>
      <div id="landmarks" class="landmarks hud" aria-label="场景地标"></div>
      <aside class="view-card hud" aria-label="当前观景点">
        <div class="card-kicker">
          <span id="view-index">01 / 05</span><span>观景手记</span>
        </div>
        <h2 id="view-title">山水入城</h2>
        <p id="view-description">
          远山如屏，碧水环城。飞檐与工业骨架，在薄雾中彼此相接。
        </p>
        <div class="view-meta">
          <span id="view-type">全景 · 鸟瞰</span
          ><span id="altitude">海拔 — m</span>
        </div>
        <div class="map-wrap">
          <svg
            id="minimap"
            viewBox="0 0 240 138"
            role="img"
            aria-label="武陵城导览图"
          >
            <defs>
              <pattern
                id="map-grid"
                width="16"
                height="16"
                patternUnits="userSpaceOnUse"
              >
                <path
                  d="M16 0H0V16"
                  fill="none"
                  stroke="currentColor"
                  stroke-opacity=".08"
                />
              </pattern>
            </defs>
            <rect width="240" height="138" fill="url(#map-grid)" />
            <path
              class="map-water"
              d="M0 101 52 88 57 71 90 70 92 23 104 0 122 0 111 62 120 90 173 93 198 81 240 86 240 102 195 99 172 112 115 108 76 88 52 109 0 122Z"
            />
            <g class="map-buildings">
              <path
                d="M35 47h33v24H35zM125 37h22v28h-22zM152 40h22v34h-22zM181 49h22v30h-22zM42 19h35v18H42zM110 16h25v16h-25zM141 18h43v12h-43zM137 80h25v6h-25zM77 107h22v15H77z"
              />
            </g>
            <path class="map-road" d="M23 82h55l12-40h114M119 9v70h92" />
            <circle class="map-core" cx="116" cy="43" r="5" />
            <g id="map-camera"><path d="m0-5 4 9-4-2-4 2z" /></g>
            <text x="220" y="18">N</text>
            <path d="m224 24-3 7h6z" fill="currentColor" /></svg
          ><span>武陵 · 城区导览</span>
        </div>
      </aside>
      <div class="environment hud">
        <span class="environment-label">天光</span>
        <div class="segmented" role="group" aria-label="时段">
          <button data-time="day" class="selected" aria-pressed="true">
            清昼</button
          ><button data-time="sunset" aria-pressed="false">暮色</button
          ><button data-time="night" aria-pressed="false">灯夜</button>
        </div>
        <button id="quality" title="切换渲染画质">精致 <span>⌄</span></button>
      </div>
      <footer class="bottom hud">
        <div class="route-heading">
          <span>选择一处风景</span><span class="route-line"></span
          ><span class="mono">EXPLORE THE CITY</span>
        </div>
        <nav id="destinations" aria-label="观景路线">
          <button class="destination active" data-view="0" aria-pressed="true">
            <span class="number">01</span
            ><span><b>山水入城</b><small>THE OVERLOOK</small></span
            ><span class="dest-arrow">↗</span>
          </button>
          <button class="destination" data-view="1" aria-pressed="false">
            <span class="number">02</span
            ><span><b>界石坪</b><small>JIESHIPING</small></span
            ><span class="dest-arrow">↗</span>
          </button>
          <button class="destination" data-view="2" aria-pressed="false">
            <span class="number">03</span
            ><span><b>方兴街巷</b><small>THE OLD QUARTER</small></span
            ><span class="dest-arrow">↗</span>
          </button>
          <button class="destination" data-view="3" aria-pressed="false">
            <span class="number">04</span
            ><span><b>水脉工坊</b><small>THE WATERWORKS</small></span
            ><span class="dest-arrow">↗</span>
          </button>
          <button class="destination" data-view="4" aria-pressed="false">
            <span class="number">05</span
            ><span><b>陵水听风</b><small>THE SOUTHERN SHORE</small></span
            ><span class="dest-arrow">↗</span>
          </button>
        </nav>
        <div class="statusbar">
          <span id="controls-hint"
            ><kbd>拖动</kbd> 环视 <span class="divider">/</span>
            <kbd>滚轮</kbd> 远近 <span class="divider">/</span>
            <kbd>右键</kbd> 平移</span
          >
          <div class="bottom-actions">
            <button id="tour" aria-pressed="false">
              <span>▷</span> 自动巡游</button
            ><button id="fly" aria-pressed="false">自由飞行 <kbd>F</kbd></button
            ><button id="hide-ui">纯净视野 <kbd>H</kbd></button
            ><span id="fps">— FPS</span>
          </div>
        </div>
      </footer>
      <button id="restore-ui" hidden>显示界面 <kbd>H</kbd></button>
      <div id="crosshair" hidden aria-hidden="true">+</div>
      <div id="flight-pad" hidden aria-label="飞行方向控制">
        <button data-key="KeyW" aria-label="前进">↑</button>
        <div>
          <button data-key="KeyA" aria-label="向左">←</button
          ><button data-key="KeyS" aria-label="后退">↓</button
          ><button data-key="KeyD" aria-label="向右">→</button>
        </div>
        <div>
          <button data-key="KeyQ" aria-label="下降">下降</button
          ><button data-key="KeyE" aria-label="上升">上升</button>
        </div>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="loading">
        <div class="loading-emblem">武</div>
        <span>山水将启</span>
        <div class="loading-line"><i></i></div>
        <small id="loading-detail">正在构筑武陵城…</small>
      </div>
      <div id="error" hidden role="alert">
        <h2>未能启动三维场景</h2>
        <p id="error-text"></p>
        <button onclick="location.reload()">重新加载</button>
      </div>
      <dialog id="modal">
        <button id="close-modal" aria-label="关闭弹窗">×</button>
        <div id="modal-content"></div>
      </dialog>
      <noscript
        ><div class="noscript">
          武陵城需要启用 JavaScript 才能运行。
        </div></noscript
      >
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
