plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = '1.1.0'
group = 'dev.codex.eventhorizon'
base { archivesName = 'eventhorizon-1.21.11' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.11.45'
    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--width', '1280', '--height', '720'
        }
    }
    mods {
        eventhorizon { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    from('LICENSE')
    exclude 'dev/codex/eventhorizon/smoke/**'
}
