plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '2.0.0'
group = 'dev.codex.altarreview'
base { archivesName = 'altar-review-1.21.11' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.11.45'
    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--username', 'AltarReviewer'
            jvmArguments.addAll '-Xmx8G', '-Daltarreview.auto=true'
        }
    }
    mods { altarreview { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
