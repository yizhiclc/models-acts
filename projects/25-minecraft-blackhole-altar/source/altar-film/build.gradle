plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '1.0.0'
group = 'dev.codex.altarfilm'
base { archivesName = 'altar-film-1.21.11' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.11.45'
    runs {
        client {
            client()
            gameDirectory = file('E:/pcl2/.minecraft/versions/1.21.11-NeoForge_21.11.45-AltarFilm')
            programArguments.addAll '--width', '1920', '--height', '1080', '--username', 'AltarDirector'
            jvmArguments.addAll '-Xmx8G', '-Daltarfilm.auto=true'
        }
    }
    mods { altarfilm { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
